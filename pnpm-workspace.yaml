# The workspace is the shim, `@voqalize/avatar`. The root manifest is a
# workspace manifest with nothing publishable in it.
packages:
  - "packages/avatar"

# The versions that must agree across the workspace, named once. `catalog:` in a
# manifest resolves to the entry here, so the package and everything testing it
# cannot end up on different pipecat clients — which is what happened under three
# lockfiles, and which npm reported as nothing at all.
#
# `@pipecat-ai/client-js` sits at the TOP of the `>=1.4 <2` range the package
# declares in `peerDependencies`; the floor is checked by the `client floor`
# job in ci-js.yml.
catalog:
  "@pipecat-ai/client-js": "1.13.0"
  react: "^18.3.1"
  react-dom: "^18.3.1"
  "@types/react": "^18.3.3"
  "@types/react-dom": "^18.3.0"
  typescript: "^5.7.3"

