<!doctype html>
<!--
  Per-avatar conformance contact sheet.

  The rig is judged by eye, so a second avatar needs the same visual check the
  first one got: every viseme, every emotion, every gaze target, rendered from
  the real generators rather than reasoned about from the numbers.

  Drives `createFace` directly with static parameter vectors — no mixer, no
  clock — so what you see is exactly `apply(p)` and nothing else.

  Switch avatars with ?face=peep (the default) or ?face=wren.
-->
<meta charset="utf-8">
<title>Avatar — avatar contact sheet</title>
<style>
  body { margin: 0; padding: 24px; background: #14171c; color: #c8ccd4;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
       color: #7d8694; margin: 28px 0 10px; font-weight: 600; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  figure { margin: 0; width: 132px; }
  .cell { width: 132px; height: 132px; background: #1c2027; border-radius: 6px;
          overflow: hidden; }
  figcaption { text-align: center; padding-top: 5px; color: #97a0ae; font-size: 11px; }
  .detail figure { width: 152px; }
  .detail .cell { width: 152px; height: 88px; }
</style>
<body>
<h1 style="font-size:15px;margin:0 0 4px">Avatar contact sheet — <span id="which"></span></h1>
<div id="out"></div>

<script type="module">
import { makeParams } from '../src/params.js';
import { VISEME_LETTERS, shapeFor } from '../src/visemes.js';
import { EMOTION_NAMES, emotionPose } from '../src/emotions.js';
import { GAZE_TARGETS, GAZE_NAMES } from '../src/gaze.js';
import { FACES, DEFAULT_FACE } from '../src/faces.js';

const qs = new URLSearchParams(location.search);
const which = qs.get('face') || DEFAULT_FACE;
document.getElementById('which').textContent = which;
// Resolve through the rig's own registry, so the sheet fails if an avatar is
// registered but broken — rather than reaching past it to the module.
const entry = FACES[which];
if (!entry) throw new Error(`no avatar "${which}" — have ${Object.keys(FACES)}`);
const mod = { createFace: entry.create };

const out = document.getElementById('out');

function section(title, entries, crop) {
  const h = document.createElement('h2');
  h.textContent = title;
  out.append(h);
  const grid = document.createElement('div');
  grid.className = 'grid';
  if (crop) grid.classList.add('detail');
  out.append(grid);
  for (const [label, params] of entries) {
    const fig = document.createElement('figure');
    const cell = document.createElement('div');
    cell.className = 'cell';
    fig.append(cell);
    const cap = document.createElement('figcaption');
    cap.textContent = label;
    fig.append(cap);
    grid.append(fig);
    const face = mod.createFace(cell);
    face.apply(makeParams(params));
    // Re-frame after apply. Safe because nothing in the rig writes viewBox —
    // every pose channel is a transform or a path, never the camera.
    if (crop) face.svg.setAttribute('viewBox', `${crop.x} ${crop.y} ${crop.w} ${crop.h}`);
  }
}

section('rest', [['REST', {}]]);

// Visemes at full intensity — the headline feature, so it goes first and gets
// every letter, not a sample.
const visemes = VISEME_LETTERS.map((L) => [L, shapeFor(L, 1)]);
section('visemes (A–H, X)', visemes);

// The same nine again, cropped to the mouth. At avatar size a viseme is maybe
// forty pixels tall, so distinct-at-a-glance is the bar, and collisions between
// letters are invisible on the full-head row — the G/B collision this rig
// already fixed once was only ever visible at this magnification.
// The close-up row frames the mouth via the avatar's own descriptor — the
// per-avatar crop table that used to live here was the finding that produced
// META in the first place.
section('visemes — mouth detail', visemes, entry.meta.mouthCrop);

section('emotions', EMOTION_NAMES.map((n) => [n, emotionPose(n, 1)]));

section('gaze', GAZE_NAMES.map((n) => [n, GAZE_TARGETS[n]]));

// The channels a static sheet otherwise never exercises.
section('extremes', [
  ['lids closed', { lidL: 1, lidR: 1 }],
  ['squint', { squintL: 1, squintR: 1 }],
  ['brows up', { browRaiseL: 1, browRaiseR: 1 }],
  ['brows down', { browRaiseL: -1, browRaiseR: -1 }],
  ['brow inner', { browInnerL: 1, browInnerR: 1 }],
  ['yaw +1', { headYaw: 1 }],
  ['yaw -1', { headYaw: -1 }],
  ['pitch +1', { headPitch: 1 }],
  ['roll +1', { headRoll: 1 }],
  ['teeth', { mouthOpen: .5, teethUpper: 1 }],
  ['tongue', { mouthOpen: .6, tongue: 1 }],
  ['smile wide', { mouthCornerL: 1, mouthCornerR: 1, mouthWidth: .9 }],
  ['frown', { mouthCornerL: -1, mouthCornerR: -1 }],
  ['press', { mouthPress: 1 }],
  ['round', { mouthRound: 1, mouthOpen: .4 }],
  ['tuck (F/V)', { mouthTuck: 1, mouthOpen: .3 }],
]);
</script>
</body>
