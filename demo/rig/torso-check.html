<!doctype html>
<meta charset="utf-8">
<title>Avatar — torso poses</title>
<style>
  body { margin:0; background:#111; color:#7fd; font:11px ui-monospace,monospace; }
  #g { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:8px; }
  .c { background:#000; position:relative; }
  .m { width:100%; }
  .l { position:absolute; left:5px; top:3px; text-shadow:0 0 3px #000; }
</style>
<div id="g"></div>
<script type="module">
// ?face=NAME picks the avatar, same convention as the contact sheet.
//
// This was the arm sheet. The rig has no arms any more, but the page earns its
// keep for the reason its last rows always did: the torso channels only fail in
// *combination*. `shoulderL` x `shoulderR` x `torsoLean` x head pose is where a
// rig leaks background from behind the shirt or slides the collar off the neck,
// and a channel-extremes row on the contact sheet cannot show that.
import { makeParams } from '../../src/params.js';
import { AVATARS, DEFAULT_AVATAR } from '../../src/avatar.js';

const qs = new URLSearchParams(location.search);
const which = qs.get('face') || DEFAULT_AVATAR;
const entry = AVATARS[which];
if (!entry) throw new Error(`no avatar "${which}" — have ${Object.keys(AVATARS)}`);
const createFace = entry.create;
document.title = `Avatar — torso poses (${which})`;

const POSES = {
  'rest': {},
  'shrug': { shoulderL: 0.9, shoulderR: 0.9 },
  'shoulder tilt': { shoulderL: -0.7, shoulderR: 0.9 },
  'lean in': { torsoLean: 1 },
  'lean back': { torsoLean: -1 },
  // The worst cases for the torso transforms. Every one of these pulls the
  // shirt inboard of the frame edge or slides the collar opening off the neck
  // behind it; if a rig leaks background, it leaks in this row.
  'tilt +1 (worst)': { shoulderL: -1, shoulderR: 1 },
  'tilt -1 (worst)': { shoulderL: 1, shoulderR: -1 },
  'shoulders -1': { shoulderL: -1, shoulderR: -1 },
  'lean back + tilt': { torsoLean: -1, shoulderL: -1, shoulderR: 1 },
  'lean back + drop': { torsoLean: -1, shoulderL: -1, shoulderR: -1 },
  'tilt + yaw + roll': { shoulderL: -1, shoulderR: 1, headYaw: -1, headRoll: 1 },
  'WANTS_IN': { torsoLean: 0.42, shoulderL: 0.45, shoulderR: 0.45, browRaiseL: 0.42,
                browRaiseR: 0.38, lidL: -0.02, lidR: -0.02, headPitch: -0.14,
                mouthOpen: 0.16, mouthWidth: 0.3 },
  'RAISE_HAND': { torsoLean: 0.30, shoulderL: 0.36, shoulderR: 0.32,
                  browRaiseL: 0.44, browRaiseR: 0.40, browInnerL: 0.20,
                  browInnerR: 0.20, headPitch: -0.26, lidL: -0.12, lidR: -0.12,
                  mouthOpen: 0.18 },
  'yielded': { torsoLean: -0.18, shoulderL: -0.12, shoulderR: -0.12 },
  'lean in + yaw': { torsoLean: 0.6, headYaw: -0.7 },
  // The lateral axis, which is the newest way to pull the shirt inboard: at
  // +-1 the trunk translates a full `turnPx` and any rig whose art stops at
  // the frame edge shows ground on the trailing side. The live mixer never
  // sends anywhere near +-1 (a weight shift peaks around 0.42 and the head's
  // share adds ~0.25), so read these as the failure envelope, not the pose.
  'turn +1 (worst)': { torsoTurn: 1 },
  'turn -1 (worst)': { torsoTurn: -1 },
  // What a weight shift actually looks like at its peak, counter-turn and all.
  'weight shift': { torsoTurn: 0.4, torsoLean: -0.05, headRoll: -0.11,
                    headYaw: -0.05, shoulderL: 0.04, shoulderR: -0.02 },
  // Trunk lagging a sustained head turn — the follow-through pose, caught
  // mid-settle where head and trunk disagree most.
  'trunk lag': { torsoTurn: 0.18, headYaw: 0.55 },
};

const g = document.getElementById('g');
for (const [name, p] of Object.entries(POSES)) {
  const c = document.createElement('div'); c.className = 'c';
  const m = document.createElement('div'); m.className = 'm';
  const l = document.createElement('div'); l.className = 'l'; l.textContent = name;
  c.append(m, l); g.append(c);
  const face = createFace(m);
  face.apply(makeParams(p));
  // The tile takes its aspect from the rig, not from a constant — avatars do not
  // share a viewBox, and a tile that assumes one letterboxes or crops the other.
  const [, , w, h] = face.svg.getAttribute('viewBox').split(/\s+/).map(Number);
  m.style.aspectRatio = `${w}/${h}`;
}
</script>
