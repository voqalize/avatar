<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avatar — live call</title>
<style>
  :root {
    --bg: #202124;
    --tile: #3c4043;
    --bar: #202124;
    --ink: #e8eaed;
    --dim: #9aa0a6;
    --line: #3c4043;
    --live: #8ab4f8;
    --hot: #f28b82;
    --ok: #81c995;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 "Google Sans", Roboto, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: 1fr auto; overflow: hidden;
  }

  /* --- stage ------------------------------------------------------------- */
  #stage { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  #tiles {
    display: flex; gap: 10px; padding: 14px; min-height: 0;
    align-items: center; justify-content: center;
  }
  /* Both tiles are the SAME box, and the box is 16:9 because that is what a
     call tile is. Meet gives each participant whatever shape their camera
     sends, but Meet is not asking you to compare two participants. This page
     is: the avatar sits directly beside a real person, and when the boxes
     differ the difference gets attributed to the *occupants* — a 4:3 camera
     next to a 576:800 rig made the agent read as taller and the human as
     wider, which is a judgement about the framing mistaken for a judgement
     about the character.

     The rigs are drawn portrait and stay that way; nothing here reshapes the
     art, because a host owns its own layout and the widget has to survive
     being handed any box. So the two occupants of a 16:9 tile are fitted the
     way each medium is normally fitted: the webcam is *cropped* to the tile
     (`object-fit: cover` — every call client does this), and the avatar is
     *fitted* to it (`preserveAspectRatio` already scales to height and
     centres), which leaves a margin either side of the drawing. That margin is
     painted to continue the rig's own backdrop — see `build` — so it reads as
     a wider room rather than as a portrait picture hung in a landscape frame.

     `flex: 1 1 0` rather than two fixed widths: whatever the row can afford,
     both get exactly the same, which is the property that actually matters
     here. `max-width` is the height cap in disguise, since aspect-ratio turns
     any width into a height. */
  .tile {
    position: relative; background: #000; border-radius: 8px;
    overflow: hidden;
    flex: 1 1 0; min-width: 0; aspect-ratio: 16/9;
    max-width: calc(58vh * 16 / 9);
  }
  #camTile { background: var(--tile); }
  .tile.talking { outline: 3px solid var(--live); outline-offset: -3px; }
  #cam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #camoff {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--dim); font-size: 13px; text-align: center; padding: 20px;
  }
  /* The avatar keeps the proportions it was tuned at. The mount fills the
     tile; the svg inside it is `xMidYMid meet`, so the drawing scales to the
     tile's height and centres, and never distorts.

     The mask feathers the drawing's two vertical edges into the painted
     backdrop. It is there because of what peep is: a WHITE shirt on a
     near-white ground, drawn to run off both sides of its own frame. Fit that
     into a wider box and the shirt stops in mid-air in two straight vertical
     lines — the "paper cut-out" failure the rig's own header warns about. A
     few percent of fade turns those lines into falloff, which the eye takes
     for light rather than for an edge. The stops are in tile coordinates and
     set at runtime from the drawing's actual width — see `build`. */
  #agentMount { position: absolute; inset: 0; }
  .chip {
    position: absolute; left: 10px; bottom: 10px; z-index: 2;
    background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 4px;
    font-size: 13px; display: flex; align-items: center; gap: 7px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.on { background: var(--live); }
  .badge {
    position: absolute; right: 10px; top: 10px; z-index: 2; font-size: 11px;
    letter-spacing: .04em; background: rgba(0,0,0,.55); padding: 3px 8px;
    border-radius: 4px; color: var(--dim); font-family: ui-monospace, monospace;
  }

  /* --- side panel -------------------------------------------------------- */
  #side {
    border-left: 1px solid var(--line); display: grid;
    grid-template-rows: auto auto 1fr; min-height: 0;
  }
  #side h2 {
    margin: 0; padding: 14px 16px 4px; font-size: 14px; font-weight: 500;
  }
  #side p.sub { margin: 0; padding: 0 16px 10px; color: var(--dim); font-size: 12px; }
  #knobs { padding: 0 16px 12px; border-bottom: 1px solid var(--line); }
  #knobs label {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 5px 0; font-size: 12.5px; color: var(--dim);
  }
  #knobs select, #knobs input[type=range] { accent-color: var(--live); }
  #knobs select {
    background: var(--tile); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 6px; font: inherit; font-size: 12px;
  }
  #log { overflow-y: auto; padding: 6px 0 18px; font-family: ui-monospace, monospace; }
  .ev {
    display: grid; grid-template-columns: 62px 1fr; gap: 8px;
    padding: 3px 16px; font-size: 11.5px; border-left: 2px solid transparent;
  }
  .ev .k { color: var(--dim); text-align: right; }
  .ev .t { color: var(--ink); overflow-wrap: anywhere; }
  .ev .n { color: var(--dim); }
  .ev.state { border-left-color: var(--live); }
  .ev.interrupt, .ev.floor { border-left-color: var(--hot); }
  .ev.speak, .ev.ack { border-left-color: var(--ok); }
  .ev.skip .t, .ev.vad .t { color: var(--dim); }

  /* --- control bar ------------------------------------------------------- */
  #bar {
    background: var(--bar); border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px; position: relative;
  }
  button.round {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--tile); color: var(--ink); cursor: pointer; font-size: 17px;
    display: grid; place-items: center;
  }
  button.round:hover { filter: brightness(1.25); }
  button.round.off { background: var(--hot); border-color: var(--hot); color: #202124; }
  button.pill {
    border-radius: 20px; border: 1px solid var(--line); background: var(--tile);
    color: var(--ink); cursor: pointer; font: inherit; font-size: 13px;
    padding: 9px 18px;
  }
  button.pill:hover { filter: brightness(1.25); }
  #status {
    position: absolute; left: 16px; bottom: 14px; color: var(--dim);
    font-size: 12px; font-family: ui-monospace, monospace;
  }
  #meter {
    position: absolute; right: 16px; bottom: 18px; width: 90px; height: 4px;
    background: var(--tile); border-radius: 2px; overflow: hidden;
  }
  #meterFill { height: 100%; width: 0; background: var(--live); }
  #hint { color: var(--dim); font-size: 12px; }
  #hint kbd {
    font: inherit; background: var(--tile); border: 1px solid #3c4043;
    border-radius: 4px; padding: 1px 5px;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="tiles">
    <div class="tile" id="camTile">
      <video id="cam" autoplay playsinline muted></video>
      <div id="camoff"><span>Camera off — click <b>Join</b> to start</span></div>
      <div class="chip"><span class="dot" id="camDot"></span>You</div>
      <div class="badge" id="vadBadge">vad: —</div>
    </div>
    <div class="tile" id="agentTile">
      <div id="agentMount"></div>
      <div class="chip"><span class="dot" id="kDot"></span>Kiran · AI agent</div>
      <div class="badge" id="stateBadge">IDLE</div>
    </div>
  </div>

  <div id="side">
    <h2>Server tokens</h2>
    <p class="sub">Everything the rig is told. In production this is a stream
      from the server; here the browser stands in for it.</p>
    <div id="knobs">
      <label>Avatar
        <select id="kAvatar"></select></label>
      <label>Gesture gain <span id="gLabel">1.0</span>
        <input type="range" id="kGest" min="0" max="1.6" step=".1" value="1"></label>
      <label>Articulation <span id="mLabel">1.0</span>
        <input type="range" id="kMouth" min="0" max="1.6" step=".1" value="1"></label>
      <!-- Body motion is the one knob whose right value is a judgement rather
           than a measurement — "alive" and "fidgety" are a slider apart and the
           line moves with tile size and with who is watching. Ship it visible so
           that argument can be had against the running rig instead of a diff. -->
      <label>Body motion <span id="bLabel">1.0</span>
        <input type="range" id="kBody" min="0" max="1.6" step=".1" value="1"></label>
      <label>Cue track
        <select id="kTrack">
          <option value="sphinx">sphinx (accurate)</option>
          <option value="phonetic">phonetic (fast)</option>
        </select></label>
      <label>Floor management
        <input type="checkbox" id="kFloor" checked></label>
    </div>
    <div id="log"></div>
  </div>
</div>

<div id="bar">
  <div id="status">not joined</div>
  <button class="round" id="btnMic" title="Mute">🎙</button>
  <button class="round" id="btnCam" title="Camera">🎥</button>
  <button class="pill" id="btnJoin">Join</button>
  <button class="pill" id="btnSpeak">Agent speaks now</button>
  <button class="pill" id="btnGreet">Greet</button>
  <button class="pill" id="btnBye">Bye</button>
  <div id="hint">hold <kbd>Space</kbd> = you are speaking</div>
  <div id="meter"><div id="meterFill"></div></div>
</div>

<script type="module">
import { createAvatar, AVATAR_NAMES, DEFAULT_AVATAR } from '../src/avatar.js';
import { createVAD } from './vad.js';
import { Floor } from './floor.js';

const $ = (id) => document.getElementById(id);

// --- which avatar ------------------------------------------------------------
// `?avatar=NAME` picks one; the side-panel select swaps it live. Live, rather
// than by reload, because the interesting comparison is between two rigs given
// the *same* conversation, and a reload drops the camera, the mic permission and
// the token log with it. Nothing above the rig holds face state, so a swap is
// just a new instance handed to the same Floor.
const wanted = new URLSearchParams(location.search).get('avatar');
let avatar = null;

function build(name) {
  const k = createAvatar({ mount: $('agentMount'), avatar: name });
  // Both tiles are 16:9 in CSS. The rig is portrait, so fitting it leaves a
  // margin either side, and the whole job here is to stop that margin looking
  // like a margin. Two runtime numbers do it, and both come from the rig
  // rather than from a constant, so a differently-shaped avatar is handled
  // without editing this file.
  //
  // 1. The backdrop. peep paints a radial wash inside its viewBox; the tile
  //    paints the same wash across the full 16:9 box, from the rig's own theme
  //    keys. Stretching it horizontally rather than matching the drawing's
  //    geometry exactly is deliberate: an exact match leaves a hard seam where
  //    the svg's rect ends (the colours there are a few levels apart), while a
  //    stretched copy diverges by the same few levels but *smoothly*, and a
  //    smooth divergence of that size is not visible at all. No edge beats a
  //    small edge.
  const t = k.theme;
  $('agentTile').style.background =
    `radial-gradient(ellipse 76% 76% at 50% 36%, ${t.bg0}, ${t.bg1})`;
  // 2. The feather. `frac` is how much of the tile's width the drawing gets
  //    once it has been scaled to the tile's height — the pillarbox arithmetic,
  //    from the declared viewBox and the tile's own ratio. The fade is placed
  //    just inside the drawing's two edges and is a fixed share of the
  //    *drawing*, not of the tile, so it stays clear of the face at any size.
  const vb = k.meta.viewBox;
  const TILE = 16 / 9;
  const frac = Math.min(1, (vb.w / vb.h) / TILE);
  const edge = 50 - frac * 50;          // % of tile width outside the drawing
  //    0.13 is close to the ceiling, not a round number: peep's ears sit about
  //    a fifth of the way in from the drawing's edge, and at 0.20 the fade
  //    reaches them and turns their ink grey. The shoulders are the only thing
  //    that should be dissolving.
  const fade = frac * 100 * 0.13;       // 13% of the drawing, each side
  const mask = `linear-gradient(to right, transparent ${edge}%, #000 ${edge + fade}%,`
             + ` #000 ${100 - edge - fade}%, transparent ${100 - edge}%)`;
  $('agentMount').style.webkitMaskImage = mask;
  $('agentMount').style.maskImage = mask;
  k.on('state', (s) => {
    $('stateBadge').textContent = s;
    const talking = s === 'SPEAKING' || s === 'TAKING_FLOOR';
    $('agentTile').classList.toggle('talking', talking);
    $('kDot').classList.toggle('on', talking);
  });
  // A fresh rig starts at the defaults, not at wherever the knobs were left.
  k.setGestureGain(+$('kGest').value);
  k.setMouthGain(+$('kMouth').value);
  k.setMotionGain(+$('kBody').value);
  return k;
}

const sel = $('kAvatar');
for (const n of AVATAR_NAMES) sel.append(new Option(n, n));
sel.value = AVATAR_NAMES.includes(wanted) ? wanted : DEFAULT_AVATAR;
avatar = build(sel.value);

const clips = await (await fetch('perf-clips.json')).json();

let vad = null, stream = null, micOn = true;

// The Floor exists from page load, not from Join. Nothing in it needs a
// microphone — the mic only supplies one of its inputs — and a reviewer on a
// machine with no mic, or one who just wants to watch a turn play, should not
// have to grant camera permission to see the thing the demo is about.
const floor = new Floor({ avatar, clips, emit: (t) => emit(t) });

// --- token log -------------------------------------------------------------
// Capped, and pinned to the bottom unless the reader has scrolled up to read
// something — a log that yanks itself away mid-read is unreadable.
const log = $('log');
function emit(tok) {
  const stuck = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
  const row = document.createElement('div');
  row.className = 'ev ' + tok.kind;
  row.innerHTML = `<span class="k">${tok.kind}</span><span class="t">${tok.text}`
    + (tok.note ? ` <span class="n">· ${tok.note}</span>` : '') + '</span>';
  log.append(row);
  while (log.children.length > 240) log.firstChild.remove();
  if (stuck) log.scrollTop = log.scrollHeight;
}

sel.onchange = (e) => {
  // Stop the turn in flight first. Handing the Floor a new rig while the old one
  // still owns a playing <audio> leaves the cue track clocking against a face
  // that has been removed from the document.
  floor.setEnabled(false);
  avatar.destroy();
  avatar = build(e.target.value);
  floor.k = avatar;
  window.avatar = avatar;
  floor.setEnabled($('kFloor').checked);
  emit({ kind: 'avatar', text: e.target.value, note: 'rig swapped' });
};

// --- join ------------------------------------------------------------------
async function join() {
  $('btnJoin').disabled = true;
  $('status').textContent = 'requesting camera and mic…';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      // `ideal`, not exact: the tile is 16:9 and the crop is mild, but ask for
      // more than the tile needs anyway. A soft human beside a vector face
      // that is sharp at any size is another difference that gets attributed
      // to the occupants rather than to the camera.
      video: { width: { ideal: 1280 }, height: { ideal: 720 } },
      // The user's audio is never played back or recorded — it is read for
      // voice activity only. Everything the browser can do to keep the VAD off
      // the agent's own output is worth having on.
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) {
    $('status').textContent = 'mic/camera denied — ' + e.message;
    $('btnJoin').disabled = false;
    return;
  }
  $('cam').srcObject = stream;
  $('camoff').style.display = 'none';
  $('camDot').classList.add('on');

  vad = await createVAD({
    stream,
    onSpeechStart: () => {
      $('camTile').classList.add('talking');
      floor.userStart();
    },
    onSpeechEnd: (reason) => {
      $('camTile').classList.remove('talking');
      floor.userEnd(reason);
    },
    onLevel: (l) => { $('meterFill').style.width = Math.min(100, l * 700) + '%'; },
  });
  vad.start();

  $('vadBadge').textContent = 'vad: ' + vad.kind;
  $('status').textContent = vad.kind === 'silero'
    ? 'joined · silero VAD'
    : 'joined · RMS fallback VAD (CDN unavailable)';
  emit({ kind: 'vad', text: 'ready', note: vad.kind });

  avatar.setState('LISTENING');
  $('btnJoin').textContent = 'Leave';
  $('btnJoin').disabled = false;
  $('btnJoin').onclick = leave;
}

function leave() {
  vad?.destroy();
  stream?.getTracks().forEach((t) => t.stop());
  vad = stream = null;
  $('camoff').style.display = 'grid';
  $('camDot').classList.remove('on');
  $('camTile').classList.remove('talking');
  $('vadBadge').textContent = 'vad: —';
  $('status').textContent = 'left';
  avatar.setState('IDLE');
  $('btnJoin').textContent = 'Join';
  $('btnJoin').onclick = join;
}

$('btnJoin').onclick = join;

// --- controls --------------------------------------------------------------
$('btnMic').onclick = () => {
  micOn = !micOn;
  stream?.getAudioTracks().forEach((t) => { t.enabled = micOn; });
  if (micOn) vad?.start(); else vad?.pause();
  $('btnMic').classList.toggle('off', !micOn);
  $('btnMic').textContent = micOn ? '🎙' : '🔇';
};
$('btnCam').onclick = () => {
  const on = !$('cam').style.opacity || $('cam').style.opacity === '1';
  $('cam').style.opacity = on ? '0' : '1';
  $('camoff').style.display = on ? 'grid' : 'none';
  $('camoff').firstElementChild.textContent = 'Camera off';
  $('btnCam').classList.toggle('off', on);
};
$('btnSpeak').onclick = () => floor.takeTurn();
// `gesture`, not `interject('WAVE')`: the hand is its own verb on the wire, and
// this is the page where a stakeholder gets to see the difference.
$('btnGreet').onclick = () => { avatar.gesture('HI'); emit({ kind: 'clip', text: 'HI', note: 'gesture' }); };
$('btnBye').onclick = () => { avatar.gesture('BYE'); emit({ kind: 'clip', text: 'BYE', note: 'gesture' }); };

// --- hold-to-talk ------------------------------------------------------------
// Space feeds the floor machine exactly what the VAD feeds it, so barge-in, the
// ack and the handover can all be seen without a microphone. Worth having for
// its own sake: on a real mic the demo is at the mercy of room noise, and a
// reviewer judging the *behaviour* wants to choose when the user speaks.
let held = false;
addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || e.repeat || held) return;
  e.preventDefault();          // Space would otherwise re-click the last button
  held = true;
  $('camTile').classList.add('talking');
  $('status').textContent = 'you are speaking (held)';
  floor.userStart();
});
addEventListener('keyup', (e) => {
  if (e.code !== 'Space' || !held) return;
  e.preventDefault();
  held = false;
  $('camTile').classList.remove('talking');
  $('status').textContent = vad ? 'joined · ' + vad.kind : 'not joined';
  floor.userEnd('end');
});

$('kGest').oninput = (e) => {
  avatar.setGestureGain(+e.target.value);
  $('gLabel').textContent = (+e.target.value).toFixed(1);
};
$('kMouth').oninput = (e) => {
  avatar.setMouthGain(+e.target.value);
  $('mLabel').textContent = (+e.target.value).toFixed(1);
};
$('kBody').oninput = (e) => {
  avatar.setMotionGain(+e.target.value);
  $('bLabel').textContent = (+e.target.value).toFixed(1);
};
$('kTrack').onchange = (e) => { floor.track = e.target.value; };
$('kFloor').onchange = (e) => floor.setEnabled(e.target.checked);

// Handy from the console when tuning.
window.avatar = avatar;
window.floor = floor;
</script>
</body>
</html>
