<!doctype html>
<meta charset="utf-8">
<title>Professional avatar comparison</title>
<style>
  :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #eef1f4; color: #17202b; }
  header { max-width: 1320px; margin: 0 auto 24px; display: flex; align-items: end; justify-content: space-between; gap: 24px; }
  h1 { margin: 0 0 5px; font-size: 24px; letter-spacing: -.02em; }
  header p { margin: 0; color: #637083; font-size: 13px; }
  .grid { max-width: 1320px; margin: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  article { min-width: 0; padding: 14px; border: 1px solid #d6dce4; border-radius: 14px; background: white; box-shadow: 0 4px 18px #26384d10; }
  .stage { width: 100%; aspect-ratio: 4/3; overflow: hidden; border-radius: 10px; background: #e6e4df; }
  h2 { margin: 13px 0 2px; font-size: 15px; }
  .read { margin: 0 0 12px; min-height: 36px; color: #697487; font-size: 12px; line-height: 1.45; }
  .proof-row { padding-top: 11px; border-top: 1px solid #e5e9ee; display: flex; align-items: center; gap: 10px; }
  .proof { flex: 0 0 130px; width: 130px; height: 97.5px; overflow: hidden; border-radius: 7px; background: #e6e4df; }
  .proof-row span { color: #768195; font-size: 11px; line-height: 1.35; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
<header>
  <div>
    <h1>Professional avatars — four approved directions</h1>
    <p>Rest pose from the shipping live rig. The inset is the 130 px production check.</p>
  </div>
</header>
<main class="grid" id="comparison"></main>
<script type="module">
  import { createCanvasRig } from '../../packages/avatar/src/canvas/create-rig.js';
  import { REST } from '../../packages/avatar/src/params.js';

  const root = '../../packages/avatar/src/canvas/data/';
  const query = new URLSearchParams(location.search);
  const shoulders = Number(query.get('shoulders') || 0);
  const pose = {
    ...REST,
    headYaw: Number(query.get('yaw') || 0),
    headPitch: Number(query.get('pitch') || 0),
    headRoll: Number(query.get('roll') || 0),
    torsoLean: Number(query.get('lean') || 0),
    torsoTurn: Number(query.get('turn') || 0),
    shoulderL: Number(query.get('shoulderL') || shoulders),
    shoulderR: Number(query.get('shoulderR') || shoulders),
  };
  const specs = [
    ['professional-male-a', 'Option A · Male', 'Midnight tailoring · pale-blue Oxford · clean side sweep'],
    ['professional-female-a', 'Option A · Female', 'Camel tailoring · ivory shell · sleek jaw-length bob'],
    ['professional-male-b', 'Option B · Male', 'Forest overshirt · ivory knit · brushed-back waves'],
    ['professional-female-b', 'Option B · Female', 'Powder-blue jacket · charcoal shell · low ponytail'],
  ];

  const instances = [];
  for (const [name, title, read] of specs) {
    const article = document.createElement('article');
    article.innerHTML = `<div class="stage"></div><h2>${title}</h2><p class="read">${read}</p><div class="proof-row"><div class="proof"></div><span>Actual 130 px<br>call-tile width</span></div>`;
    document.querySelector('#comparison').append(article);
    const images = Object.fromEntries(['top-body', 'hair-back', 'hair-front'].map((part) => {
      const file = `${name}-${part}.webp`;
      return [file, new URL(`${root}img/${file}`, location.href)];
    }));
    const canvas = createCanvasRig({
      url: new URL(`${root}${name}.rig.json`, location.href),
      images,
      face: () => import('../../packages/avatar/src/canvas/avatars/round/face.mjs'),
      label: title,
    });
    instances.push(canvas.factory(article.querySelector('.stage')));
    instances.push(canvas.factory(article.querySelector('.proof')));
  }

  window.done = new Promise((resolve) => {
    let frames = 0;
    const draw = () => {
      for (const instance of instances) instance.apply({ pose, hand: null });
      if (frames++ < 75) requestAnimationFrame(draw);
      else resolve(true);
    };
    requestAnimationFrame(draw);
  });
</script>
