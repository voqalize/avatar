<!doctype html>
<meta charset="utf-8">
<title>Peep control plane — live harness</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2eee7; }
  #mount { width: min(72vw, 440px); aspect-ratio: 576 / 800; background: white; }
</style>
<div id="mount" aria-label="Peep's live animated control planes without static art"></div>
<script type="module">
  import { makeParams } from '../../packages/avatar/src/params.js';
  import { createFace } from '../../packages/avatar/src/face-peep-control-plane.js';
  const face = createFace(document.querySelector('#mount'));
  face.apply(makeParams());
  // Console helper for authoring: pose({ mouthOpen: .7, teethUpper: 1 }).
  window.pose = (overrides = {}) => face.apply(makeParams(overrides));
</script>
