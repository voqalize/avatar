; The server has its own pytest root because it is not part of the package:
; `packages/avatar-py/pyproject.toml` sets `testpaths = ["tests"]` and would never look here.
; This file is also what puts this directory on `sys.path`, so `import canned`
; resolves without making the server a package it has no other reason to be.
[pytest]
asyncio_mode = auto
