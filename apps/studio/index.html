<!doctype html>
<!-- `dark` is the whole of the theming. The voice-ui-kit stylesheet defines its
     semantic palette twice — once on `:root` and once under a bare `.dark` rule
     — so this class is what makes every kit component and every token in
     styles.css agree on one scheme. No ThemeProvider needed. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The kit's `--color-background` under `.dark`, resolved. It is what the
         browser paints around the page, so a different grey here shows as a
         seam above the bar on mobile. -->
    <meta name="theme-color" content="#09090b" />
    <!-- Inline, because a request for a file that is not there is an error in
         the console of a tool whose console you are meant to be reading.

         The same drawing as `.mark` in the bar: paper, an edge, one ink stroke.
         It used to be a blue circular smiley, which was a face from a different
         project — a favicon is the smallest place this page states its thesis
         and it was stating somebody else's. The three values are `--paper`,
         `--paper-edge` and the ink the mark uses; they are literals here
         because a data URI cannot read a custom property. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='0.5' y='0.5' width='15' height='15' rx='4' fill='%23f4f1e9' stroke='%23d9d3c4'/%3E%3Cpath d='M4.4 6.4q3.6 4.8 7.2 0' fill='none' stroke='%231a1a1a' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Avatar Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
