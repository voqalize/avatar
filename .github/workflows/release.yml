# Publish both halves of the library from one tag.
#
# The two packages version in lockstep and ship together, because they are two
# ends of one wire format: `@voqalize/avatar` renders what `voqalize-avatar`
# sends, and a version pair that can drift is a protocol mismatch waiting to be
# debugged in production. So there is one tag, `v<semver>`, it must equal both
# manifests, and a release that cannot publish both publishes neither.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Neither job holds a long-lived credential. npm and PyPI both accept an OIDC
# token minted by this workflow for this repository — see RELEASING.md for the
# one-time setup on each registry.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch: # re-run a failed half without re-tagging

# One release at a time per tag. `workflow_dispatch` exists precisely to re-run
# a half that failed, and two of those racing would try to publish the same
# version twice. Never `cancel-in-progress`: killing a run mid-publish is how
# you get the split this file is built to prevent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: tag matches both manifests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # The published manifests, not the workspace root — the root
          # package.json is private and its version means nothing.
          npm_version=$(node -p "require('./packages/avatar/package.json').version")
          py_version=$(grep -m1 '^version = ' packages/avatar-py/pyproject.toml | cut -d'"' -f2)
          # A release version is one string and both manifests carry it. A
          # PRERELEASE is not: semver says `0.3.0-rc.1`, PEP 440 normalizes the
          # same thing to `0.3.0rc1`, and neither registry accepts the other's
          # spelling — so there is no tag that equals both manifests literally.
          # The tag is the semver one; this derives what pyproject.toml must
          # say. Only the three forms npm and PyPI agree on the meaning of are
          # accepted, so an unrecognised suffix fails here rather than at upload.
          py_expected=$(python3 - "$tag" <<'PY'
          import re, sys
          tag = sys.argv[1]
          m = re.fullmatch(r"(\d+\.\d+\.\d+)(?:-(alpha|beta|rc)\.(\d+))?", tag)
          if not m:
              sys.exit(f"tag {tag} is not v<major>.<minor>.<patch>[-(alpha|beta|rc).N]")
          base, kind, num = m.groups()
          print(base + ({"alpha": "a", "beta": "b", "rc": "rc"}[kind] + num if kind else ""))
          PY
          )
          echo "tag=$tag  npm=$npm_version  pypi=$py_version (expected $py_expected)"
          if [ "$tag" != "$npm_version" ] || [ "$py_expected" != "$py_version" ]; then
            echo "::error::tag $tag disagrees with packages/avatar/package.json ($npm_version, expected $tag) or packages/avatar-py/pyproject.toml ($py_version, expected $py_expected)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  ci:
    name: ci
    needs: guard
    uses: ./.github/workflows/ci.yml

  npm:
    name: publish @voqalize/avatar
    # Behind `wheels`, not beside it, and that is what makes the promise at the
    # top of this file true. Building a wheel is the only half that fails for
    # reasons outside this repo — a manylinux image, a brew formula, the
    # upstream tarball — and npm is the half that cannot be taken back, since a
    # published version number is gone for good. So the compiled artifacts must
    # exist before anything is published; `pypi` then publishes them.
    needs: [guard, ci, wheels]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # mints the OIDC token npm exchanges for a publish grant
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing landed in npm 11.5.1; the runner's bundled npm is
      # usually newer, but pinning the floor makes the failure legible. The
      # workspace installs with pnpm and publishes with npm on purpose: the
      # OIDC trusted-publishing exchange below is npm's, and `npm publish` reads
      # the manifest, not the store.
      - run: npm install -g npm@latest
      # Runs `prepare`, which compiles packages/avatar/dist — the tarball's
      # entrypoint.
      - run: pnpm install --frozen-lockfile
      # --provenance signs an attestation linking the tarball to this workflow
      # run and this commit. Free on a public repo, and the only way a consumer
      # can check that what they installed came from what they can read. Run in
      # the package: `npm publish` reads the manifest in its working directory,
      # and the root one is the private workspace manifest.
      - run: npm publish --provenance --access public
        working-directory: packages/avatar

  # One wheel per platform, each carrying the aligner, plus the sdist. Compiled
  # here from the pinned upstream tarball — never from a committed binary.
  wheels:
    needs: [guard, ci]
    uses: ./.github/workflows/wheels.yml

  pypi:
    name: publish voqalize-avatar
    needs: [guard, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages/avatar-py/dist
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
      # PyPI rejects the whole upload if one file is wrong, so a bad set fails
      # here rather than half-publishing a release whose Linux users get lipsync
      # and whose macOS users silently do not.
      - name: check the set before uploading
        run: |
          ls -la packages/avatar-py/dist
          test -n "$(ls packages/avatar-py/dist/*.tar.gz 2>/dev/null)" || { echo "::error::no sdist"; exit 1; }
          n=$(ls packages/avatar-py/dist/*.whl | wc -l)
          [ "$n" -ge 3 ] || { echo "::error::only $n wheels; expected one per platform"; exit 1; }
          ! ls packages/avatar-py/dist/*py3-none-any.whl 2>/dev/null || { echo "::error::a pure wheel got in"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/avatar-py/dist

  github-release:
    name: github release
    needs: [guard, npm, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes diffs against the previous tag
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
