# The JS gate: `@voqalize/avatar`. The rig is judged by eye and only
# *conformance* can be automated; the client is judged by test. Nothing here can
# tell you whether a face reads as `THINKING` or as asleep — that is what the rig
# pages are for. Its own workflow because it is its own release —
# release-npm.yml runs this and nothing from the Python side before it
# publishes.
name: ci-js

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release-npm.yml runs this before it publishes anything

permissions:
  contents: read

concurrency:
  group: ci-js-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widget:
    name: widget + client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # One install for the workspace, which is one package now. `prepare`
      # compiles packages/avatar/client/ on install, so this also proves the one
      # build step in the repo still works.
      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: unit tests
        # Includes the rig conformance sweep
        # (`packages/avatar/test/conformance.test.ts`)
        # — every state, emotion, gaze and semantic action on every shipped
        # face, asserting finite in-range params and an attached drawing. It
        # used to be a puppeteer job; the assertions never looked at a pixel,
        # so a real Chrome was paying for nothing.
        run: pnpm test

      - name: consume the tarball
        # The one job here that uses the package the way a consumer does:
        # installed from a tarball, resolved through the real `exports` map, with
        # the optional peers present. Studio used to be this — a vite build
        # against the workspace link — and Studio is part of the working tree
        # now, so the check became what it was always standing in for.
        #
        # Every entry point, because a missing subpath is invisible to a build
        # that imports one — read from the installed `exports` map, so an entry
        # added or removed is checked without anyone editing this list. The
        # compiled characters are the reason `three` is installed here; they are
        # also the only exports that read a file at runtime, and this proves the
        # import resolves, not that the GLB fetches.
        run: |
          cd packages/avatar
          TARBALL="$(pnpm pack | tail -1)"
          WORK="$(mktemp -d)"
          cp "$TARBALL" "$WORK/"
          cd "$WORK"
          npm init -y >/dev/null
          npm i --silent "./$(basename "$TARBALL")" three @pipecat-ai/client-js react react-dom
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("node_modules/@voqalize/avatar/package.json", "utf8"));
            const paths = Object.keys(pkg.exports)
              .filter((k) => k !== "./package.json")
              .map((k) => k.slice(1));
            for (const p of paths) {
              const m = await import("@voqalize/avatar" + p);
              if (Object.keys(m).length === 0) throw new Error(`empty export: ${p}`);
              console.log((p || ".").padEnd(18), Object.keys(m).join(", ").slice(0, 60));
            }
          '

      - name: npm package contents
        # The tarball is the artifact consumers actually get; `files` has been
        # wrong before (dist/ is gitignored, and npm applies .gitignore inside a
        # files entry).
        working-directory: packages/avatar
        run: |
          pnpm pack --dry-run
          test -f dist/index.js
          # The one export re-exports the widget by relative path out of dist,
          # so `src/` has to be in the tarball too or the entrypoint is a
          # dangling import.
          test -f src/avatar.js

  # The floor of the declared `@pipecat-ai/client-js` peer range, checked rather
  # than asserted — the same reason ci-py.yml matrixes pipecat. The import
  # is types-only (see AvatarClient.ts), so a typecheck IS the compatibility
  # test: if 1.4's declarations no longer describe what we call, `>=1.4` in
  # package.json is a promise we are not keeping.
  client-floor:
    name: client-js floor (1.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Replaces the catalog pin for this checkout only, and two details here
      # were wrong in a way nothing could report:
      #
      # `--filter`, not `-w`. `-w` edits the workspace ROOT importer, and once
      # the published manifest moved into `packages/avatar/` that package became
      # its own importer with its own resolved copy of the peer — which is what
      # `tsc` finds first. The floor has to be installed where the code being
      # typechecked will look for it.
      #
      # And no `--no-frozen-lockfile`: `pnpm add` does not accept it (it rewrites
      # the lockfile by definition), so the step exited non-zero on sight.
      - run: pnpm --filter @voqalize/avatar add -D "@pipecat-ai/client-js@1.4.0"
      # Print what is actually about to be typechecked. The failure mode this
      # job had was silence, so it now says which version it got.
      - run: |
          node -p "'floor under test: ' + require('./packages/avatar/node_modules/@pipecat-ai/client-js/package.json').version"
      - run: pnpm run typecheck
