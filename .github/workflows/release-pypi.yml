# Publish `voqalize-avatar` to PyPI from a `py-v<semver>` tag.
#
# The Python package releases on its own, independent of `@voqalize/avatar`
# (release-npm.yml). What keeps the two compatible is the wire contract, not a
# shared version number — see RELEASING.md § Compatibility.
#
#   git tag -a py-v0.3.1 -m "voqalize-avatar 0.3.1" && git push origin py-v0.3.1
#
# No long-lived credential: PyPI accepts an OIDC token minted by this workflow
# for this repository — see RELEASING.md for the one-time setup.
name: release-pypi

on:
  push:
    tags: ["py-v[0-9]+.[0-9]+.[0-9]+", "py-v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch: # re-run a failed publish without re-tagging; pick the tag as the ref

# One release at a time per tag. Never `cancel-in-progress`: killing a run
# mid-upload is how a version ends up half-published.
concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: tag matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            py-v*) ;;
            *) echo "::error::$GITHUB_REF_NAME is not a py-v tag — run this workflow on the tag"; exit 1 ;;
          esac
          tag="${GITHUB_REF_NAME#py-v}"
          py_version=$(grep -m1 '^version = ' packages/avatar-py/pyproject.toml | cut -d'"' -f2)
          # The tag is semver, the manifest PEP 440: `0.3.1-rc.1` is what PyPI
          # stores as `0.3.1rc1`, and it accepts no other spelling. So this
          # derives what pyproject.toml must say. Only the three pre-release
          # forms both conventions agree on are accepted, so an unrecognised
          # suffix fails here rather than at upload.
          py_expected=$(python3 - "$tag" <<'PY'
          import re, sys
          tag = sys.argv[1]
          m = re.fullmatch(r"(\d+\.\d+\.\d+)(?:-(alpha|beta|rc)\.(\d+))?", tag)
          if not m:
              sys.exit(f"tag {tag} is not py-v<major>.<minor>.<patch>[-(alpha|beta|rc).N]")
          base, kind, num = m.groups()
          print(base + ({"alpha": "a", "beta": "b", "rc": "rc"}[kind] + num if kind else ""))
          PY
          )
          echo "tag=$tag  pypi=$py_version (expected $py_expected)"
          if [ "$py_expected" != "$py_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with packages/avatar-py/pyproject.toml ($py_version, expected $py_expected)"
            exit 1
          fi

  ci:
    name: ci
    needs: guard
    uses: ./.github/workflows/ci-py.yml

  # One wheel per platform, each carrying the aligner, plus the sdist. Compiled
  # here from the pinned upstream tarball — never from a committed binary. Every
  # artifact exists before anything is uploaded, and PyPI takes the set whole.
  wheels:
    needs: [guard, ci]
    uses: ./.github/workflows/wheels.yml

  pypi:
    name: publish voqalize-avatar
    needs: [guard, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # mints the OIDC token PyPI exchanges for a publish grant
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages/avatar-py/dist
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
      # PyPI rejects the whole upload if one file is wrong, so a bad set fails
      # here rather than half-publishing a release whose Linux users get lipsync
      # and whose macOS users silently do not.
      - name: check the set before uploading
        run: |
          ls -la packages/avatar-py/dist
          test -n "$(ls packages/avatar-py/dist/*.tar.gz 2>/dev/null)" || { echo "::error::no sdist"; exit 1; }
          n=$(find packages/avatar-py/dist -name '*.whl' | wc -l)
          [ "$n" -ge 3 ] || { echo "::error::only $n wheels; expected one per platform"; exit 1; }
          ! ls packages/avatar-py/dist/*py3-none-any.whl 2>/dev/null || { echo "::error::a pure wheel got in"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/avatar-py/dist

  github-release:
    name: github release
    needs: [guard, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes diff against the previous py-v tag
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          # The previous release of THIS package. Left to itself gh picks the
          # nearest tag of any family, and the notes would then be diffed
          # against an npm release.
          prev=$(git tag --list 'py-v*' --sort=-v:refname | awk -v cur="$GITHUB_REF_NAME" 'found {print; exit} $0 == cur {found=1}')
          gh release create "$GITHUB_REF_NAME" \
            --title "voqalize-avatar ${GITHUB_REF_NAME#py-v}" \
            --generate-notes ${prev:+--notes-start-tag "$prev"}
