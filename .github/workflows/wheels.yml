# Build the distributable `voqalize-avatar` wheels — one per platform, each
# carrying the `avatarsync` aligner and its model tree.
#
# **This workflow is canonical.** `native/avatarsync/build.sh` is the local loop:
# it exists so a developer can compile and iterate on their own machine, and it
# takes the same portability flags so a local build is debuggable against this
# one. But nothing a laptop produces is ever published. Every byte that reaches
# PyPI is compiled here, from the pinned upstream tarball plus our patch, on a
# runner whose glibc and SDK floor we chose deliberately.
#
# The matrix is the supported-platform list. Adding a row is how this project
# supports a new platform; there is no other list to update, because the wheel
# tag is derived from the library rather than declared (py/scripts/stage_native.py).
#
# Linux builds inside the manylinux_2_28 image rather than on the runner. The
# runner is Ubuntu 24.04 (glibc 2.39), which would produce a wheel that pip
# refuses to install on Ubuntu 22.04, Debian 12 or RHEL 9 — most of production.
# glibc 2.28 reaches back to RHEL 8 and Debian 10 and costs nothing.
name: wheels

on:
  workflow_dispatch:
  workflow_call: # the release workflow builds what it publishes

permissions:
  contents: read

jobs:
  wheel:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - id: darwin-arm64
            runner: macos-14
            container: ""
          # No darwin-x64 row, and the reason is upstream rather than ours. Our
          # aligner builds and runs fine on Intel macOS — the row was here, on
          # macos-15-intel, and got as far as a staged wheel. What fails is
          # installing it: pipecat-ai requires onnxruntime, which publishes no
          # macOS x86-64 wheel at all (its only mac tag is macosx_14_0_arm64). So
          # `pip install voqalize-avatar` cannot resolve on an Intel mac whatever
          # we upload, and a 44 MB wheel sitting there would only advertise
          # support that does not exist. If onnxruntime ships Intel mac wheels
          # again, add the row back with `runner: macos-15-intel` — that image is
          # itself scheduled to go away in August 2027.
    steps:
      - uses: actions/checkout@v4

      # Boost is headers-only and >= 1.54 (upstream's rhubarb/CMakeLists.txt), so
      # AlmaLinux 8's 1.66 is fine. CMake must be >= 3.30 because upstream sets
      # policy CMP0167, and older CMake errors on a policy it has never heard of;
      # the image's is older, so it comes from pip. Pinned off 4.x, which drops
      # compatibility with the minimums 1.14.0's vendored libraries declare.
      - name: build deps (linux)
        if: startsWith(matrix.id, 'linux')
        run: |
          dnf install -y boost-devel patch which >/dev/null
          /opt/python/cp312-cp312/bin/pip install --quiet 'cmake==3.31.*'
          ln -sf /opt/python/cp312-cp312/bin/cmake /usr/local/bin/cmake
          cmake --version

      - name: build deps (macos)
        if: startsWith(matrix.id, 'darwin')
        run: brew install boost >/dev/null

      # Compiles the library AND materialises res/ (the 56 MB model tree, which
      # is generated rather than committed). Both are wheel inputs.
      - name: compile avatarsync
        working-directory: native/avatarsync
        run: ./build.sh

      - name: report the floor this library earned
        working-directory: native/avatarsync
        run: |
          lib=bin/${{ matrix.id }}/libavatarsync.so
          if [ "${{ runner.os }}" = "Linux" ]; then
            ldd "$lib" || true
            strings "$lib" | grep -oE '(GLIBC|GLIBCXX|CXXABI)_[0-9.]+' | sort -uV | tail -5
          else
            lib=bin/${{ matrix.id }}/libavatarsync.dylib
            otool -L "$lib"; otool -l "$lib" | grep -m1 minos
          fi

      # Before packaging, not after: a library that will not load is not worth
      # wrapping in 44 MB of model tree. Deliberately ctypes and nothing else —
      # this runs before the package is installed, and it is checking the link,
      # not the legs. What the library can actually *say* is checked at the end,
      # against the installed wheel, through the shipped CLI.
      - name: smoke-test the library
        working-directory: native/avatarsync
        run: |
          python3 - <<'PY'
          import ctypes, glob, re, sys
          from pathlib import Path

          # The expected ABI is READ from the binding, never written here. These
          # two numbers have to move together — a library and a _native.py from
          # different builds is precisely what this step exists to catch — and a
          # copy of the constant in a workflow is a copy that goes stale
          # silently, which is what it did: this asserted 1 against a library
          # that had said 3 since the streaming legs landed.
          binding = Path("../../py/src/voqalize_avatar/_native.py").read_text()
          expected = int(re.search(r"^ABI_VERSION = (\d+)", binding, re.M).group(1))

          path = (glob.glob("bin/*/libavatarsync.so") + glob.glob("bin/*/libavatarsync.dylib"))[0]
          lib = ctypes.CDLL(path)
          abi, shapes = lib.avs_abi_version(), lib.avs_shape_count()
          print(f"{path}: ABI {abi} (binding wants {expected}), {shapes} shapes")
          if abi != expected:
              sys.exit(f"library speaks ABI {abi}, _native.py speaks {expected}")
          # A-H plus X. The widget's whole vocabulary; see docs/contract-protocol.md.
          if shapes != 9:
              sys.exit(f"expected 9 shapes, library reports {shapes}")
          PY

      - name: install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # stage_native.py reads the compiled library and derives the wheel's
      # platform tag from what it actually requires — the highest versioned glibc
      # symbol, or the recorded macOS deployment target. It refuses a library that
      # links libstdc++ dynamically, because a wheel tag cannot express that
      # floor and pip would offer the wheel to machines it cannot run on.
      - name: stage the payload and build the wheel
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 py/scripts/stage_native.py
          cd py && uv build --wheel

      # The failure this guards is silent and expensive: if staging is skipped or
      # the hook does not fire, hatchling happily produces a 64 KB py3-none-any
      # wheel. It publishes, it installs everywhere, and it has no lipsync.
      - name: refuse a wheel with no payload
        run: |
          set -e
          whl=$(ls py/dist/*.whl)
          echo "built $whl"
          case "$whl" in
            *py3-none-any.whl) echo "::error::pure wheel — the payload was not staged"; exit 1 ;;
          esac
          size=$(wc -c < "$whl")
          [ "$size" -gt 20000000 ] || { echo "::error::$whl is only $size bytes"; exit 1; }

      # Proves the artifact, not the tree: unpack the wheel somewhere else
      # entirely and drive the library through the same entry point a consumer
      # uses. Catches a path that only resolves inside the checkout, a model tree
      # that did not make it into the zip, and a library that loads but cannot
      # answer. `info` is written for exactly this: it opens the engine, reports
      # what the model loaded, and runs the text leg, so a wheel that installs
      # and imports but produces no cues fails here rather than on PyPI.
      - name: install the wheel and run lipsync from it
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Pinned, because an unpinned `uv venv` takes whatever interpreter the
          # image happens to lead with — which on the aarch64 image was 3.15, for
          # which pipecat's onnxruntime has no wheel. Our own wheel is
          # `py3-none-<plat>` and installs on any of them; this pin is about the
          # dependency tree the verification drags in, not about the artifact.
          uv venv --python 3.12 /tmp/verify
          uv pip install --python /tmp/verify/bin/python py/dist/*.whl
          # From /tmp, so nothing can resolve out of the checkout.
          cd /tmp && /tmp/verify/bin/voqalize-avatar info | tee info.txt
          if grep -q MISSING info.txt; then
            echo "::error::the installed wheel is missing a payload file"; exit 1
          fi
          if ! grep -q 'text leg' info.txt; then
            echo "::error::the installed wheel produced no cues"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.id }}
          path: py/dist/*.whl
          if-no-files-found: error

      # The bare library, so `native/avatarsync/bin/<platform>/` in the repo can
      # be refreshed from a canonical build rather than from somebody's laptop:
      #   gh run download <id> -n avatarsync-<platform> -D native/avatarsync/bin/<platform>
      - uses: actions/upload-artifact@v4
        with:
          name: avatarsync-${{ matrix.id }}
          path: |
            native/avatarsync/bin/${{ matrix.id }}/libavatarsync.*
            native/avatarsync/bin/${{ matrix.id }}/avatarsync.recipe
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Source only — no library, no model tree. Installing it gives the state
      # channel and the widget's own amplitude fallback, which the library treats
      # as an ordinary condition rather than an error.
      - run: cd py && uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: py/dist/*.tar.gz
          if-no-files-found: error
