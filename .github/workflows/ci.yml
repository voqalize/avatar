# The gate. Three suites, because they answer different questions: the rig is
# judged by eye and only *conformance* can be automated, the client is judged by
# test, and the backend is judged by test at both ends of its declared pipecat
# range. Nothing here can tell you whether a face reads as `THINKING` or as
# asleep — that is what the rig pages are for.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs this before it publishes anything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widget:
    name: widget + client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # One install for the whole workspace — the package, the IDE and the rig
      # tooling. `prepare` compiles packages/avatar/client/ on install, so this
      # also proves the one build step in the repo still works.
      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: unit tests
        # Includes the rig conformance sweep
        # (`packages/avatar/test/conformance.test.ts`)
        # — every state, emotion, gaze and semantic action on every shipped
        # face, asserting finite in-range params and an attached drawing. It
        # used to be a puppeteer job; the assertions never looked at a pixel,
        # so a real Chrome was paying for nothing.
        run: pnpm test

      - name: studio typecheck and build
        # `build` is `tsc --noEmit && vite build`, so this is the typecheck too.
        # Studio resolves `@voqalize/avatar` through the workspace link — the
        # real `exports` map, out of `packages/avatar/dist` — so a build
        # failing here is
        # usually the published entrypoint being wrong rather than the IDE: it
        # is the only thing in CI that consumes the package as a consumer does,
        # from outside.
        run: pnpm run studio:build

      - name: npm package contents
        # The tarball is the artifact consumers actually get; `files` has been
        # wrong before (dist/ is gitignored, and npm applies .gitignore inside a
        # files entry).
        working-directory: packages/avatar
        run: |
          pnpm pack --dry-run
          test -f dist/index.js
          # The one export re-exports the widget by relative path out of dist,
          # so `src/` has to be in the tarball too or the entrypoint is a
          # dangling import.
          test -f src/avatar.js

  # The floor of the declared `@pipecat-ai/client-js` peer range, checked rather
  # than asserted — the same reason the backend job matrixes pipecat. The import
  # is types-only (see AvatarClient.ts), so a typecheck IS the compatibility
  # test: if 1.4's declarations no longer describe what we call, `>=1.4` in
  # package.json is a promise we are not keeping.
  client-floor:
    name: client-js floor (1.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Replaces the catalog pin for this checkout only, and two details here
      # were wrong in a way nothing could report:
      #
      # `--filter`, not `-w`. `-w` edits the workspace ROOT importer, and once
      # the published manifest moved into `packages/avatar/` that package became
      # its own importer with its own resolved copy of the peer — which is what
      # `tsc` finds first. The floor has to be installed where the code being
      # typechecked will look for it.
      #
      # And no `--no-frozen-lockfile`: `pnpm add` does not accept it (it rewrites
      # the lockfile by definition), so the step exited non-zero on sight.
      - run: pnpm --filter @voqalize/avatar add -D "@pipecat-ai/client-js@1.4.0"
      # Print what is actually about to be typechecked. The failure mode this
      # job had was silence, so it now says which version it got.
      - run: |
          node -p "'floor under test: ' + require('./packages/avatar/node_modules/@pipecat-ai/client-js/package.json').version"
      - run: pnpm run typecheck

  backend:
    name: backend (pipecat ${{ matrix.pipecat }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the declared range. The floor is a real claim — one
        # pipecat constructor moved inside it, and
        # packages/avatar-py/tests/helpers.py spans
        # the seam — so "we support 1.4" is checked, not asserted.
        include:
          - pipecat: floor
            resolution: lowest-direct
          - pipecat: resolved
            resolution: highest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The library AND its 56 MB model tree, both from the same script. No
      # library is committed for any platform, so without this compile every
      # decoder test skips — which is exactly what happened, silently, behind a
      # green check, back when a mac library was committed and this runner was
      # Linux. `--recipe-id` is the compile's
      # own input hash, so the cache moves when the patch or the pinned upstream
      # does and not when an unrelated line of build.sh does.
      - name: aligner cache key
        id: recipe
        run: echo "id=$(packages/avatar-py/native/avatarsync/build.sh --recipe-id)" >> "$GITHUB_OUTPUT"

      - name: cache the aligner library and model tree
        id: aligner-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/avatar-py/native/avatarsync/bin
            packages/avatar-py/native/avatarsync/res
            packages/avatar-py/native/avatarsync/.cache
          key: avatarsync-${{ runner.os }}-${{ steps.recipe.outputs.id }}

      - name: install build dependencies
        if: steps.aligner-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev

      - name: build the aligner
        if: steps.aligner-cache.outputs.cache-hit != 'true'
        run: packages/avatar-py/native/avatarsync/build.sh

      - name: tests
        working-directory: packages/avatar-py
        env:
          UV_RESOLUTION: ${{ matrix.resolution }}
          # Turns "the aligner is missing" from a skip into a failure. Without
          # it a green backend job proves only that the pure-Python half works;
          # the decoder, the pool ceiling and both viseme legs go untested. See
          # packages/avatar-py/tests/conftest.py.
          AVATAR_REQUIRE_ALIGNER: "1"
        # `--frozen` is wrong here: the whole point of the matrix is to
        # re-resolve at each end of the range rather than replay the lockfile.
        run: uv run --resolution "$UV_RESOLUTION" pytest -q

      # The local server is not part of the package and has no aligner in the
      # loop, so it rides the resolved leg only — what it checks is the frame
      # contract between our two canned services and pipecat's, and that
      # contract does not vary with the dependency floor.
      - name: server frame contract
        if: matrix.pipecat == 'resolved'
        working-directory: apps/server
        run: uv run --project ../../packages/avatar-py --group server --group dev python -m pytest -q

      - name: distributions build and validate
        if: matrix.pipecat == 'resolved'
        working-directory: packages/avatar-py
        run: |
          uv build
          uvx twine check dist/*
