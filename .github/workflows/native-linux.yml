# Build `native/avatarsync/bin/linux-x64/avatarsync` on a real x86_64 host.
#
# The binaries are committed so that a clone runs without a compiler and a
# deploy is package-only. That means the linux one has to be produced somewhere,
# and a mac cannot do it: cross-compiling upstream's vendored pocketsphinx is not
# a supported configuration, and emulating x86_64 under qemu turns a two-minute
# build into a very long one.
#
# So: run it here, on demand, and download the artifact.
#
#   gh workflow run native-linux.yml
#   gh run download <id> -n avatarsync-linux-x64 -D native/avatarsync/bin/linux-x64
#   git add native/avatarsync/bin/linux-x64 && git commit
#
# The runner is ubuntu-24.04 (glibc 2.39), which sets the floor this binary can
# be deployed against. Boost is linked statically; everything else is libc,
# libm, libgcc_s and libstdc++, and the job prints the highest versioned symbol
# it ended up requiring so a floor change is visible in the log rather than at
# runtime on someone's node.
name: native-linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: |
          sudo apt-get update
          # cmake >= 3.30 is required (upstream sets policy CMP0167); the runner
          # image already ships a newer one, so this only fills in the rest.
          sudo apt-get install -y build-essential cmake libboost-all-dev curl patch git
          cmake --version

      - name: build
        working-directory: native/avatarsync
        run: ./build.sh

      - name: report the glibc/libstdc++ floor
        working-directory: native/avatarsync
        run: |
          ldd bin/linux-x64/avatarsync || true
          objdump -T bin/linux-x64/avatarsync \
            | grep -oE '(GLIBC|GLIBCXX|CXXABI)_[0-9.]+' | sort -uV | tail -20

      - name: smoke-test the binary
        working-directory: native/avatarsync
        run: |
          printf '%s\n' '{"id":1,"op":"text","ms":1200,"text":"Hello there."}' \
            | ./bin/linux-x64/avatarsync --res res --weights data/phone_weights.json \
            | tee /dev/stderr | grep -q '"cues"'

      - uses: actions/upload-artifact@v4
        with:
          name: avatarsync-linux-x64
          path: |
            native/avatarsync/bin/linux-x64/avatarsync
            native/avatarsync/bin/linux-x64/avatarsync.recipe
          if-no-files-found: error
