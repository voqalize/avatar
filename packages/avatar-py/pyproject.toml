[project]
name = "voqalize-avatar"
version = "0.3.0"
description = "Drive a browser talking-head avatar from a pipecat pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Voqalize" }]
keywords = ["avatar", "lipsync", "viseme", "rhubarb", "pipecat", "voice-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    # No `License ::` classifier, deliberately. `license = "MIT"` above is a
    # PEP 639 SPDX expression, and PyPI *rejects* an upload that carries both a
    # License-Expression and a license classifier. Neither hatchling nor
    # `twine check` catches it — the failure is at the registry, on the one
    # command that cannot be retried against a version already published.
    "Typing :: Typed",
]
dependencies = [
    # Base pipecat only — no transport, STT or TTS extras. This package sits in
    # somebody else's pipeline and must not have an opinion about which services
    # they chose; every extra we named here would be one they pay for twice.
    #
    # The floor is 1.4 because that is where `FunctionCallsStartedFrame` and
    # `UserTurnInferenceCompletedFrame` exist, and both consumers are at or above
    # it — a higher floor would make one of them upgrade before it could adopt
    # this at all. The ceiling is the major, because the whole package is an
    # opinion about pipecat's frame vocabulary and a 2.0 gets to change that.
    "pipecat-ai>=1.4,<2",
    "loguru>=0.7.3",
]

[project.scripts]
# The only command-line tool in the project. `native/avatarsync` builds a shared
# library and nothing else, so this is what you run by hand — same library, same
# legs, no second front end to drift out of step with the first.
voqalize-avatar = "voqalize_avatar.cli:main"

[project.urls]
Homepage = "https://github.com/voqalize/avatar"
Repository = "https://github.com/voqalize/avatar"
Issues = "https://github.com/voqalize/avatar/issues"
# The wire format this package speaks, and the widget that renders it.
Protocol = "https://github.com/voqalize/avatar/blob/main/docs/contract-wire.md"

[build-system]
# >=1.27 because `license = "MIT"` + `license-files` below is PEP 639 spelling;
# an older hatchling rejects it with "Field `project.license` must be a table".
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Not for building — `uv build` gets its own isolated copy. This is so
    # `tests/test_wheel_hook.py` can import `hatch_build.py`, which is the only
    # coverage the platform-wheel decision has: CI builds pure wheels only, so
    # without this the predicate is exercised for the first time by a tag push.
    "hatchling>=1.27",
]
# The local server, and nothing else, gets to name services. `dependencies`
# above stays transport- and vendor-free on purpose — these groups are how the
# server picks its vendors without the library acquiring an opinion.
#
# Nothing here needs a credential. That is the whole point of the split below:
# `--tts canned` is the default, so the install that gets someone their first
# talking head must not drag in an SDK for a service they have no account with.
server = [
    "pipecat-ai[silero,webrtc]>=1.7,<2",
    # The server serves its own page rather than pipecat's prebuilt client, so it
    # owns the web server too. FastAPI is already in the graph — SmallWebRTC's
    # request handler imports `HTTPException` — but naming it here is what makes
    # `uvicorn` available and the dependency honest.
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
# Opt-in, and only for one job: checking lipsync against a real streaming
# generator, which the canned service cannot be (server/README.md § Verifying
# lipsync). Every import of these lives inside its own factory in bot.py, so the
# server runs with this group absent.
server-vendors = [
    # `cartesia` is here for vql-speech, which speaks Cartesia's protocol —
    # `--tts vql-speech` is `CartesiaTTSService` pointed at a different host.
    "pipecat-ai[google,cartesia]>=1.7,<2",
    # vql-speech takes a self-minted RS256 JWT rather than a static key, so the
    # server has to sign one. `[crypto]` is the half that can do RS256.
    "pyjwt[crypto]>=2.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voqalize_avatar"]
# `_native/` is gitignored and staged by scripts/stage_native.py immediately
# before a release build. Hatchling honours .gitignore when it collects files,
# so it has to be told that this one is deliberate.
artifacts = ["src/voqalize_avatar/_native/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# The sdist is the source, not the payload: 44 MB of compiled binary and
# acoustic model would be neither reviewable nor rebuildable from it.
# `native/avatarsync/{bin,res}` are build outputs of `build.sh`. CI builds the
# sdist in a fresh checkout where they do not exist, but a maintainer running
# `uv build` after a local `build.sh` would otherwise ship a different artifact
# than CI does — they are ignored by a nested .gitignore, which the sdist
# builder does not read.
exclude = [
    "src/voqalize_avatar/_native",
    "native/avatarsync/bin",
    "native/avatarsync/res",
    "native/avatarsync/.build",
    "native/avatarsync/.cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
